[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512
max_test_rejects = 200000

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 2000

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
