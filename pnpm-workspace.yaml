# pnpm settings for Arcade.
#
# allowBuilds: these three packages ship prebuilt native binaries and run a
# postinstall step to select the right one for the platform. They are required
# by tsx/vitest (esbuild) and eslint (unrs-resolver).
allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true
  # Reown AppKit, now a direct dependency: it supplies the connect modal and
  # builds the wagmi config. Its postinstall only runs a version-check script,
  # which the modal does not need, so it stays off.
  '@reown/appkit': false
  # Optional native speedups for `ws`, reached through WalletConnect's transport.
  # `ws` declares both as optional and falls back to pure JavaScript, so leaving
  # them unbuilt costs a little WebSocket throughput and nothing else.
  #
  # These must hold a real true/false. pnpm writes "set this to true or false"
  # as a placeholder, and an undecided entry makes `pnpm install` exit 1 — which
  # is recoverable locally with a CLI flag but fails the Vercel build outright,
  # before any of the app is even compiled.
  bufferutil: false
  utf-8-validate: false

# minimumReleaseAge: pnpm's default supply-chain guard rejects very fresh
# releases. Arc mainnet launched 2026-09-16 and this project pins current
# stable toolchain versions, some of which are newer than the default cutoff.
# Set to 0 so the pinned lockfile resolves. Re-raise this (e.g. to 1440
# minutes) once the pinned versions have aged, and review pnpm-lock.yaml
# diffs on every dependency bump.
minimumReleaseAge: 0
